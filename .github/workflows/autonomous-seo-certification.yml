name: Autonomous SEO certification

on:
  workflow_run:
    workflows: ["Validate repository"]
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

jobs:
  canonical-validation:
    name: canonical-validation-prerequisite
    runs-on: ubuntu-latest
    steps:
      - name: Require successful canonical validation
        shell: bash
        run: |
          test "${{ github.event.workflow_run.name }}" = "Validate repository"
          test "${{ github.event.workflow_run.status }}" = "completed"
          test "${{ github.event.workflow_run.conclusion }}" = "success"
          test -n "${{ github.event.workflow_run.head_sha }}"

  autonomous-seo-p0-rollback-certification:
    name: autonomous-seo-p0-rollback-certification
    needs: canonical-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Capture trusted Python and Git
        id: trusted
        shell: pwsh
        run: |-
          $python = Get-Command python -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $git = Get-Command git -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not [IO.Path]::IsPathFullyQualified($python) -or -not (Test-Path -LiteralPath $python -PathType Leaf)) { throw 'trusted Python path is invalid' }
          if (-not [IO.Path]::IsPathFullyQualified($git) -or -not (Test-Path -LiteralPath $git -PathType Leaf)) { throw 'trusted Git path is invalid' }
          "python=$python" >> $env:GITHUB_OUTPUT
          "git=$git" >> $env:GITHUB_OUTPUT
      - name: Prove exact source candidate
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted.outputs.git }}';
          $raw = & '${{ steps.trusted.outputs.python }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.workflow_run.head_sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof failed' }
      - name: Preserve trusted source-integrity validator
        shell: pwsh
        run: Copy-Item -LiteralPath scripts/validate_source_integrity.py -Destination "$env:RUNNER_TEMP/validate_source_integrity.py"
      - name: Rehearse autonomous SEO P0 rollback
        run: python scripts/rehearse_autonomous_seo_rollback.py --receipt autonomous-seo-p0-rollback-receipt.json
      - name: Read certified baseline
        id: rollback
        shell: pwsh
        run: |-
          $receipt = Get-Content -LiteralPath autonomous-seo-p0-rollback-receipt.json -Raw | ConvertFrom-Json
          "baseline=$($receipt.baseline_commit)" >> $env:GITHUB_OUTPUT
          "candidate=$($receipt.candidate_commit)" >> $env:GITHUB_OUTPUT
      - name: Prove exact restored autonomous baseline
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted.outputs.git }}';
          $raw = & '${{ steps.trusted.outputs.python }}' -I -E -S "$env:RUNNER_TEMP/validate_source_integrity.py" --root $env:GITHUB_WORKSPACE --expected-sha '${{ steps.rollback.outputs.baseline }}' --proof-mode restored-baseline --allow-untracked autonomous-seo-p0-rollback-receipt.json;
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'restored autonomous baseline proof failed' }
      - name: Install baseline validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate restored baseline repository
        shell: pwsh
        run: ./scripts/validate-repository.ps1
      - name: Seal autonomous rollback receipt
        shell: python
        run: |
          import json
          from pathlib import Path
          path = Path('autonomous-seo-p0-rollback-receipt.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          if data['result'] != 'TREE_MATCH':
              raise SystemExit('rollback receipt was not tree-matched')
          data['result'] = 'PASS'
          path.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
      - name: Upload autonomous rollback receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: autonomous-seo-p0-rollback-receipt
          path: autonomous-seo-p0-rollback-receipt.json
          if-no-files-found: error

  external-review-trust-root-readiness:
    name: external-review-trust-root-readiness
    needs: canonical-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Prove exact source integrity
        run: python scripts/validate_source_integrity.py --expected-sha ${{ github.event.workflow_run.head_sha }}
      - name: Install trust-root validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prove exact source integrity after dependency installation
        run: python scripts/validate_source_integrity.py --expected-sha ${{ github.event.workflow_run.head_sha }}
      - name: Lint autonomous trust root
        run: >-
          ruff check scripts/autonomous_seo_review_trust.py
          scripts/validate_autonomous_seo_external_reviews.py
          scripts/rehearse_autonomous_seo_rollback.py
          tests/test_autonomous_seo_phase_closure_e2e.py
          tests/test_autonomous_seo_expansion_program.py
      - name: Type-check autonomous trust root
        run: >-
          mypy scripts/autonomous_seo_review_trust.py
          scripts/validate_autonomous_seo_external_reviews.py
          scripts/rehearse_autonomous_seo_rollback.py
          --ignore-missing-imports --check-untyped-defs
      - name: Authenticate reviews or report NOT_APPLICABLE before closure
        run: python -m scripts.validate_autonomous_seo_external_reviews
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prove exact source integrity after provider lookup
        run: python scripts/validate_source_integrity.py --expected-sha ${{ github.event.workflow_run.head_sha }}

  autonomous-seo-certification:
    name: autonomous-seo-certification
    if: always()
    needs:
      - canonical-validation
      - autonomous-seo-p0-rollback-certification
      - external-review-trust-root-readiness
    runs-on: ubuntu-latest
    steps:
      - name: Enforce autonomous SEO certification
        shell: bash
        run: |
          test "${{ needs.canonical-validation.result }}" = "success"
          test "${{ needs.autonomous-seo-p0-rollback-certification.result }}" = "success"
          test "${{ needs.external-review-trust-root-readiness.result }}" = "success"
