name: Validate repository

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation_matrix:
    name: validate (${{ matrix.os }}, ${{ matrix.python-version }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Capture trusted Python interpreter
        id: trusted_python
        shell: pwsh
        run: |-
          $resolved = Get-Command python -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $git = Get-Command git -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not [IO.Path]::IsPathFullyQualified($resolved) -or -not (Test-Path -LiteralPath $resolved -PathType Leaf)) { throw 'trusted Python path is not one absolute file' }
          if (-not [IO.Path]::IsPathFullyQualified($git) -or -not (Test-Path -LiteralPath $git -PathType Leaf)) { throw 'trusted Git path is not one absolute file' }
          "path=$resolved" >> $env:GITHUB_OUTPUT
          "git_path=$git" >> $env:GITHUB_OUTPUT
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Install seoctl editable package
        run: python -m pip install -e . --no-deps
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Validate generated dependency lock
        run: python scripts/validate_dependency_lock.py
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Validate canonical skill convergence
        run: python scripts/validate_canonical_skill_consistency.py
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
