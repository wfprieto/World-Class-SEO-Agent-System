  provider_authentication:
    name: provider-authentication
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Capture trusted Python interpreter
        id: trusted_python
        shell: pwsh
        run: |-
          $resolved = Get-Command python -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $git = Get-Command git -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not [IO.Path]::IsPathFullyQualified($resolved) -or -not (Test-Path -LiteralPath $resolved -PathType Leaf)) { throw 'trusted Python path is not one absolute file' }
          if (-not [IO.Path]::IsPathFullyQualified($git) -or -not (Test-Path -LiteralPath $git -PathType Leaf)) { throw 'trusted Git path is not one absolute file' }
          "path=$resolved" >> $env:GITHUB_OUTPUT
          "git_path=$git" >> $env:GITHUB_OUTPUT
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Install provider-validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Authenticate remediation CI receipts
        run: python scripts/validate_remediation_program.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WCSEO_AUTHENTICATE_CI_RECEIPTS: "true"
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Authenticate live GitHub governance controls
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: python scripts/capture_github_controls.py --ci-observable
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Reject provider-unverifiable fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: pwsh
        run: throw 'Provider authentication is unavailable for fork pull requests; repository certification fails closed.'
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }

  validate:
    name: validate
    permissions:
      contents: read
    needs: [validation_matrix, provider_authentication]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce validation matrix
        shell: bash
        run: test "${{ needs.validation_matrix.result }}" = "success"
      - name: Enforce provider authentication
        shell: bash
        run: test "${{ needs.provider_authentication.result }}" = "success"

