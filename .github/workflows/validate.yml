  clean_wheel_install:
    permissions:
      contents: read
    name: clean wheel (${{ matrix.os }}, Python 3.13)
    needs: quality_security_release
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Capture trusted Python interpreter
        id: trusted_python
        shell: pwsh
        run: |-
          $resolved = Get-Command python -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          $git = Get-Command git -CommandType Application | Select-Object -First 1 -ExpandProperty Source
          if (-not [IO.Path]::IsPathFullyQualified($resolved) -or -not (Test-Path -LiteralPath $resolved -PathType Leaf)) { throw 'trusted Python path is not one absolute file' }
          if (-not [IO.Path]::IsPathFullyQualified($git) -or -not (Test-Path -LiteralPath $git -PathType Leaf)) { throw 'trusted Git path is not one absolute file' }
          "path=$resolved" >> $env:GITHUB_OUTPUT
          "git_path=$git" >> $env:GITHUB_OUTPUT
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: quality-security-release
      - name: Prove exact source integrity
        shell: pwsh
        run: >-
          $env:PATH = Split-Path -Parent '${{ steps.trusted_python.outputs.git_path }}';
          $raw = & '${{ steps.trusted_python.outputs.path }}' -I -E -S scripts/validate_source_integrity.py --expected-sha ${{ github.event.pull_request.head.sha || github.sha }};
          $exitCode = $LASTEXITCODE; $proof = $raw | ConvertFrom-Json;
          if ($exitCode -or $proof.status -ne 'PASS' -or @($proof.errors).Count) { throw 'source-integrity proof did not return structured PASS' }
      - name: Verify isolated wheel and packaged product assets
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist -Filter *.whl | Select-Object -First 1).FullName
          if (-not $wheel) { throw "Built wheel artifact was not found" }
          python scripts/verify_clean_wheel.py $wheel

