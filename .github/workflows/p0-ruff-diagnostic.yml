name: P0 Ruff import diagnostic

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff_import_diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.1
      - name: Print exact import-sort patch
        run: |
          python -m ruff check scripts/autonomous_seo_expansion_closure.py scripts/validate_autonomous_seo_expansion_program.py --select I --diff || true
