name: Support request
description: Ask for non-security usage or implementation help
title: "[Support]: "
labels: ["support"]
body:
  - type: markdown
    attributes:
      value: Do not submit vulnerabilities, credentials, private URLs, or client data here. Use the private security report form for security issues.
  - type: input
    id: control_id
    attributes:
      label: Operations control ID
      description: "Registry IDs are defined in governance/repository-operations.json; use the applicable ID or UNMAPPED."
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Accountable owner and backup status
      description: Name the expected owner role and backup, or state Unassigned / OWNER_ACTION_REQUIRED.
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objective or problem
      description: Describe what you are trying to accomplish and what is blocking you.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Tag, commit SHA, or branch
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Python version, installation method, and relevant non-sensitive configuration.
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: What you tried
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Non-sensitive evidence
      description: Include sanitized output, source locations, and the exact commit where possible.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification attempted
      description: Include the command or review method and observed result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback trigger and containment
      description: State the trigger and recovery or containment; use not applicable only with a reason.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Privacy and security
      options:
        - label: I removed credentials, private URLs, client data, tokens, vulnerability details, and private conduct reports.
          required: true
