[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "world-class-seo-agent-system"
version = "1.7.0"
description = "model-agnostic, evidence-governed SEO operating system with documentation-first contracts and a bounded executable layer."
requires-python = ">=3.11,<3.14"
dependencies = ["jsonschema>=4.22.0,<5", "tenacity>=8.2.0"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.scripts]
seoctl = "seoctl.entrypoint:main"

[project.optional-dependencies]
render = ["playwright>=1.49,<2"]
dev = ["jsonschema>=4.22.0,<5","pytest>=8.0.0,<10","pytest-asyncio>=0.23.0,<2","pytest-cov>=6.0,<8","PyYAML>=6.0.3,<7","tenacity>=8.2.0,<10","ruff>=0.9,<1","mypy>=1.15,<3","pip-audit>=2.7,<3","build>=1.2,<2","pip-tools>=7.5,<8"]

[tool.setuptools]
include-package-data = true
py-modules = ["main", "sensitive_data"]

[tool.setuptools.packages.find]
include = ["adapters*", "contracts*", "evaluation*", "integrations*", "runtime*", "scripts*", "security*", "seoctl*"]

[tool.setuptools.package-data]
seoctl = ["*.json"]

[tool.setuptools.data-files]
"share/world-class-seo" = ["SYSTEM_SPEC.md", "SYSTEM_MAP.md"]
"share/world-class-seo/agents" = ["agents/*.md"]
"share/world-class-seo/knowledge" = ["knowledge/*.md", "knowledge/*.json"]
"share/world-class-seo/knowledge/reference-packs" = ["knowledge/reference-packs/*.md"]
"share/world-class-seo/knowledge/source-assets" = ["knowledge/source-assets/*.md"]
"share/world-class-seo/skills" = ["skills/*.md", "skills/*.json"]
"share/world-class-seo/skills/packages" = ["skills/packages/*.md"]
"share/world-class-seo/skills/flow-prompts" = ["skills/flow-prompts/*.md"]
"share/world-class-seo/orchestration" = ["orchestration/*.json", "orchestration/*.md"]
"share/world-class-seo/templates" = ["templates/*.md"]
"share/world-class-seo/workflows" = ["workflows/*.md"]
"share/world-class-seo/schemas" = ["schemas/*.json"]
"share/world-class-seo/prompts" = ["prompts/*.json", "prompts/*.md"]
"share/world-class-seo/evaluation/product-proof" = ["evaluation/product-proof/*.json"]
"share/world-class-seo/evaluation/comparative" = ["evaluation/comparative/*.json", "evaluation/comparative/*.md"]
"share/world-class-seo/examples/product-proof" = ["examples/product-proof/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "C4", "SIM", "C90"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "normal"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["runtime", "seoctl", "integrations", "adapters", "contracts", "security"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 78
show_missing = true
skip_covered = false

# These are non-regression floors, not claims of sufficient test depth. The
# repository-wide 78% gate remains independently enforced; no file is omitted.
[tool.wcseo.risk_coverage]
"adapters/evidence_store.py" = 67
"adapters/google_pagespeed_live.py" = 83
"adapters/url_safety.py" = 87
"integrations/authority_media/transport.py" = 67
"integrations/google/client.py" = 68
"integrations/google/gsc.py" = 62
"integrations/technical/browser.py" = 45
"integrations/technical/http.py" = 72
"runtime/executor.py" = 96
"runtime/llm.py" = 64
"runtime/structured_output.py" = 89
"runtime/tools.py" = 83
"runtime/workflow_runner.py" = 93
